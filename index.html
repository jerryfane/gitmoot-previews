<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gitmoot Previews</title>
    <style>
      :root {
        color: #101010;
        background: #ffffff;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100vw - 40px));
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(40px, 8vw, 84px);
        line-height: 0.95;
        letter-spacing: 0;
      }

      p {
        margin: 0;
        max-width: 520px;
        color: #444444;
        font-size: 18px;
        line-height: 1.55;
      }

      code {
        display: inline-block;
        margin-top: 24px;
        padding: 10px 12px;
        border: 1px solid #d8d8d8;
        border-radius: 6px;
        color: #111111;
        background: #f7f7f7;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Gitmoot Previews</h1>
      <p>
        Static preview hosting for Gitmoot human feedback review demos.
      </p>
      <code>/runs/&lt;run-id&gt;/&lt;item-id&gt;/&lt;option&gt;/</code>
    </main>
  </body>
</html>
